<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Martin House Trust School | Learning for Life</title>
  <meta name="description"
    content="Martin House Trust School in Chisamba, Zambia — British National Curriculum (Prep) and Cambridge (College), Christian ethos, boarding, and holistic education on 80 hectares." />
  <meta name="author" content="Martin House Trust School" />
  <meta name="keywords"
    content="Martin House Trust School, Chisamba, Lusaka, Zambia, prep school, college, Cambridge, boarding school, admissions" />
  <link rel="canonical" href="https://martinhouseschool.com/" />

  <!-- DNS Prefetch for external resources -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
  <!-- Preconnect for critical third-party origins -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Preload Outfit and Inter fonts -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700;800;900&family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700;800;900&family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap"
    media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700;800;900&family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" />
  </noscript>

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Martin House Trust School | Learning for Life" />
  <meta property="og:description"
    content="Day and boarding school on Kalundu Farm, Chisamba — Prep and College with a Christian ethos." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://martinhouseschool.com/" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Martin House Trust School" />
  <meta name="twitter:description" content="Learning for life at Martin House Trust School, Chisamba, Zambia." />

  <!-- Critical CSS for above-the-fold content (reduces CLS) -->
  <style>
    /* Critical inline styles for initial render */
    :root {
      --primary: 218 61% 26%;
      --secondary: 140 33% 32%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f8f6f1;
    }

    #root {
      min-height: 100vh;
    }
  </style>
</head>

<body>

  <div id="root">
    <!-- Premium Initial Preloader -->
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#ffffff;flex-direction:column;gap:2rem;">
      <div style="animation:pulse-logo 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;">
        <div style="font-size:28px;font-weight:900;color:#1a3a6b;letter-spacing:-1px;font-family:system-ui,sans-serif;">MARTIN HOUSE SCHOOL</div>
      </div>
      <div style="width:160px;height:2px;background:rgba(26,58,107,0.1);overflow:hidden;border-radius:2px;">
        <div style="height:100%;width:30%;background:#1a3a6b;animation:slide-progress 1.5s ease-in-out infinite;"></div>
      </div>
    </div>
    <style>
      @keyframes pulse-logo {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(0.98); }
      }
      @keyframes slide-progress {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
